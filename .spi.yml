# Opts this package in to Swift Package Index documentation hosting.
#
# `platform: ios` is deliberate. MusicLibrary, AudioSession and
# VoiceoverRecorder are compiled only for iOS and visionOS, so documentation
# built on the default macOS pair would leave out the surface this package
# exists for.
#
# On iOS, SPI runs `xcodebuild docbuild -scheme KadrAudio`, taking the scheme
# name from the documentation target. That scheme exists only because
# Package.swift names the package "KadrAudio": through v0.7.0 it was named
# "kadr-audio", the only scheme was `kadr-audio`, every documentation build
# failed with "does not contain a scheme named KadrAudio", and the docs URL
# returned 404. Keep the two names in step. CI runs the same docbuild.
#
# Validate changes at https://swiftpackageindex.com/validate-spi-manifest
version: 1
builder:
  configs:
    - platform: ios
      documentation_targets: [KadrAudio]
